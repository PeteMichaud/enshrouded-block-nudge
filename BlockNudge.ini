; BlockNudge settings. Put this file next to enshrouded.exe. Restart the game after a change.
; Comments must be on their own lines.

[General]
; 0 = the mod installs nothing and the game is vanilla.
Enabled=1
; Cells moved per nudge. One cell is 0.5 m.
StepCells=1
; Cells moved per nudge while the LargeStep key is held.
LargeStepCells=4
; 1 = the lock and offset survive a click, so you can place, nudge, place.
StayLockedAfterPlace=1
; 1 = swap the left and right nudge directions.
FlipLeftRight=0
; 1 = round the locked position to the 0.5 m grid. Try this if the ghost jumps when you lock.
SnapOnLock=0
; BlockNudge.log next to enshrouded.exe.
Log=1
; One log line a second with the cursor's state while a building shape is in hand.
Trace=1

[Keys]
; Names: A-Z, 0-9, F1-F24, Up, Down, Left, Right, PageUp, PageDown, Home, End, Insert,
; Delete, LShift, RShift, LCtrl, RCtrl, LAlt, RAlt, Space, Tab, Enter, Backspace,
; Numpad0-Numpad9, Mouse3-Mouse5, None. Or a virtual-key code such as 0x48.
Lock=H
Forward=Up
Back=Down
Left=Left
Right=Right
Up=PageUp
Down=PageDown
; Held while nudging.
LargeStep=LShift

[KeyRepeat]
; Holding a nudge key: wait DelayMs, then step every RateMs. RateMs=0 turns repeating off.
DelayMs=350
RateMs=80
